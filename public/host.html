<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Host</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap"><h1 class="brand">YouTube<span>ClipQuiz</span> Host</h1><section id="setup" class="panel"><div class="grid"><label>Music decade<select id="decade"><option>All</option><option>1960s</option><option>1970s</option><option>1980s</option><option>1990s</option><option>2000s</option><option>2010s</option><option>2020s</option></select></label><label>Number of questions<input id="count" type="number" min="3" max="20" value="10"></label></div><button id="create">Generate Automatic Quiz</button><p id="error" class="bad notice hidden"></p></section><section id="lobby" class="panel center hidden"><h2>Scan to join</h2><img id="qr"><div id="room" class="big"></div><p id="joinUrl" class="muted"></p><button id="start">Start Automatic Quiz</button></section><section id="game" class="panel hidden"><div class="grid"><div><h2 id="title">Question</h2><p id="meta" class="muted"></p><div id="timer" class="timer"></div><div id="playerFrame"></div><div id="choices" class="choices"></div><p id="status" class="notice"></p></div><div><h3>Leaderboard</h3><div id="players"></div></div></div></section></main><script src="/socket.io/socket.io.js"></script><script src="https://www.youtube.com/iframe_api"></script><script src="host.js"></script></body></html>
